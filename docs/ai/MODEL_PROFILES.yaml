# Application-owned model policy; model names resolved by the internal LiteLLM gateway.
# Users choose a chat model per request/conversation from `selectable_models`;
# the choice is validated server-side against org -> project allowlists and budgets.
selectable_models:
  default: gpt-6-luna
  options:
    - alias: gpt-6-luna
      label: "Luna (default — balanced)"
      reasoning_effort: medium
    - alias: gpt-6-terra
      label: "Terra"
      reasoning_effort: medium
  # Sol is deliberately not offered (cost policy): blocked below, never routed to, ignored as a stored preference.
  # Capabilities, context limits and prices MUST be verified at deployment for terra;
  # a model failing capability validation (tool calling, structured output) is hidden, not degraded.
  selection_scope: [org_allowlist, project_allowlist, user_preference, per_request]
  precedence: "per_request > user_preference > project_default > org_default > gpt-6-luna"
blocked_models: [gpt-6-sol]

# Task routing: every AI operation runs on the cheapest model and reasoning effort that does the job well.
# Deep, multi-hop reasoning over the whole system (architecture, flows, drift, integration design) uses Terra with high
# effort; grounded answers and ADR completion use Luna/medium; rewriting and page search use Luna/low.
# `max_output_tokens` caps visible + reasoning tokens (reasoning tokens are billed as output).
# `expected_output_tokens` and `evidence_tokens` seed cost estimates until the ledger has history for the task.
# `user_selectable`: the model picker in the UI may override the model (never into a blocked one); effort stays per task.
tasks:
  architecture_draft:  {model: gpt-6-terra, reasoning_effort: high,    max_output_tokens: 16000, expected_output_tokens: 6000, evidence_tokens: 9000, purpose: "Draft an architecture view from docs and code"}
  architecture_review: {model: gpt-6-terra, reasoning_effort: high,    max_output_tokens: 12000, expected_output_tokens: 4000, evidence_tokens: 8000, purpose: "Review the architecture against decisions"}
  flow_explain:        {model: gpt-6-terra, reasoning_effort: high,    max_output_tokens: 8000,  expected_output_tokens: 2500, evidence_tokens: 4000, purpose: "Find and explain end-to-end flows"}
  drift_review:        {model: gpt-6-terra, reasoning_effort: high,    max_output_tokens: 8000,  expected_output_tokens: 2500, evidence_tokens: 5000, purpose: "Judge ADR/docs/code non-conformities"}
  integration_design:  {model: gpt-6-terra, reasoning_effort: high,    max_output_tokens: 12000, expected_output_tokens: 4500, evidence_tokens: 7000, purpose: "Design an integration (Assistant, design mode)", user_selectable: true}
  doc_drafting:        {model: gpt-6-terra, reasoning_effort: medium,  max_output_tokens: 12000, expected_output_tokens: 5000, evidence_tokens: 7000, purpose: "Write AI documents (user guide, PRD, ARF, dev guide)"}
  question_answering:  {model: gpt-6-luna,  reasoning_effort: medium,  max_output_tokens: 10000, expected_output_tokens: 2800, evidence_tokens: 9000, purpose: "Assistant, Data scope (grounded RAG)", user_selectable: true}
  adrs:                {model: gpt-6-luna,  reasoning_effort: medium,  max_output_tokens: 5000,  expected_output_tokens: 1800, evidence_tokens: 3000, purpose: "Draft or complete an ADR (MADR)"}
  general_chat:        {model: gpt-6-luna,  reasoning_effort: medium,  max_output_tokens: 6000,  expected_output_tokens: 1500,  evidence_tokens: 0,    purpose: "Assistant, General scope (no project data)", user_selectable: true}
  text_extend:         {model: gpt-6-luna,  reasoning_effort: low,     max_output_tokens: 2000,  expected_output_tokens: 500,  evidence_tokens: 1500, purpose: "Extend or rewrite a text field"}
  page_ask:            {model: gpt-6-luna,  reasoning_effort: low,     max_output_tokens: 1500,  expected_output_tokens: 350,  evidence_tokens: 1800, purpose: "Ask the Flows, Decisions or Docs page (search first, AI only to explain)"}
  summarization:       {model: gpt-6-luna,  reasoning_effort: minimal, max_output_tokens: 1500,  expected_output_tokens: 400,  evidence_tokens: 2000, purpose: "Summaries and extraction"}
profiles:
  architecture-reasoning:
    model_alias: "${selected_model}"     # user choice, default gpt-6-luna
    reasoning_effort: medium
    allowed_operations: [integration_design, adrs, architecture_review, question_answering, architecture_draft]
    max_output_tokens: 10000
    require_citations: true
    sensitive_payload_traces: false
  general-chat:                          # Assistant "General" scope and text extension: no project evidence is sent
    model_alias: "${selected_model}"
    reasoning_effort: medium
    allowed_operations: [general_chat, text_extend, doc_drafting]
    max_output_tokens: 6000
    require_citations: false
    sensitive_payload_traces: false
  architecture-fast:
    model_alias: gpt-6-luna              # system task, not user-selectable
    allowed_operations: [summarization, extraction_assist, task_draft]
    max_output_tokens: 4000
    require_citations: true
    sensitive_payload_traces: false
  architecture-fallback:
    model_alias: gpt-5.6-luna
    allowed_operations: [integration_design, adrs, architecture_review, question_answering]
    enabled: false
  architecture-embedding:
    model_alias: text-embedding-3-large  # never user-selectable: changing it requires re-indexing
    dimensions: 1024
    enabled: false
routing:
  default_provider: openai-via-litellm
  allow_direct_provider_api: false
  allow_unapproved_cross_residency_fallback: false
  future_on_prem_enabled: false
limits:
  max_parallel_requests_per_project: 4
  max_evidence_items_per_request: 120
  max_graph_nodes_per_ai_query: 500
  hard_budget_enforcement: true
observability:
  langfuse_enabled: true
  prompt_content_capture_default: false
  record_selected_model: true            # model alias recorded on every PromptRun and Langfuse trace
