openapi: 3.1.0
info:
  title: ArchTwin API (representative contract)
  version: 0.1.0-draft
  description: This is a non-exhaustive OpenAPI contract for the initial platform. Each capability adds paths and schemas during implementation.
servers:
  - url: https://archtwin.example.invalid/api/v1
security:
  - oidc: []
paths:
  /projects:
    get:
      summary: List projects authorized for the current principal
      operationId: listProjects
      parameters:
        - in: query
          name: cursor
          schema: {type: string}
      responses:
        '200':
          description: Authorized projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Project'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProject'}
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects/{projectId}/architecture:
    get:
      summary: Get scoped architecture snapshot
      operationId: getProjectArchitecture
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {in: query, name: environment, required: true, schema: {type: string}}
        - {in: query, name: snapshot_id, schema: {type: string}}
      responses:
        '200':
          description: Scoped architecture, desired/static/observed explicitly separated
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot_id: {type: string}
                  environment: {type: string}
                  graph: {type: object, additionalProperties: true}
                  freshness: {type: object, additionalProperties: true}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects/{projectId}/integrations:design:
    post:
      summary: Draft cross-platform integration options; does not apply changes
      operationId: draftIntegration
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {in: header, name: Idempotency-Key, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_project_id, question]
              properties:
                target_project_id: {type: string}
                question: {type: string, minLength: 1, maxLength: 10000}
                environment: {type: string, default: prod}
      responses:
        '202':
          description: Authorized async proposal run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: {type: string}
                  state: {type: string, enum: [queued]}
        '403': {$ref: '#/components/responses/Forbidden'}
  /projects/{projectId}/export/{resource}:
    get:
      summary: Export a page (or one item of it) as Markdown, Word, PDF or a ZIP bundle; audited as export.{resource}
      operationId: exportResource
      description: |
        Same feature flag and view permission as the page (docs need document:export). Markdown is the canonical format
        (diagrams as Mermaid); DOCX/PDF render it; ZIP holds every item as Markdown, the combined document in all three
        formats and a manifest.json with provenance (project, snapshot, generated_at, source revisions).
      parameters:
        - {$ref: '#/components/parameters/ProjectId'}
        - {in: path, name: resource, required: true, schema: {type: string, enum: [architecture, flows, drift, decisions, docs]}}
        - {in: query, name: format, schema: {type: string, enum: [md, docx, pdf, zip], default: md}}
        - {in: query, name: id, description: 'one flow id, ADR id, drift finding id or generated document id', schema: {type: string}}
        - {in: query, name: status, description: drift only, schema: {type: string}}
        - {in: query, name: verdict, description: drift only, schema: {type: string}}
        - {in: query, name: severity, description: drift only, schema: {type: string}}
      responses:
        '200':
          description: The file (Content-Disposition attachment; {project-slug}-{resource}-{date}.{ext})
          content:
            text/markdown: {schema: {type: string}}
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
            application/zip: {schema: {type: string, format: binary}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Export too large (narrow it with filters or one item)}
  /home:
    get:
      summary: Personal cross-project overview (only projects the caller may view; each read under its own RLS context)
      operationId: personalHome
      responses:
        '200':
          description: Totals, needs-attention items, recent activity and health for the 60 most recently active visible projects (totals.visible_projects / totals.truncated report the cap)
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals: {type: object, additionalProperties: {type: integer}}
                  projects: {type: array, items: {type: object, additionalProperties: true}}
                  attention: {type: array, items: {type: object, additionalProperties: true}}
                  activity: {type: array, items: {type: object, additionalProperties: true}}
  /webhooks/{orgId}/{projectId}/{connectorId}:
    post:
      summary: Provider webhook ingress — authenticated by HMAC signature, not by a user token
      description: >
        GitHub: X-Hub-Signature-256 + X-GitHub-Delivery. GitLab: X-Gitlab-Token (the webhook secret token) + X-Gitlab-Event-UUID
        (or Idempotency-Key); push / merge request / issue hooks. Taiga: X-TAIGA-WEBHOOK-SIGNATURE = hex HMAC-SHA1(key, body),
        delivery id derived from the body; deletes wait for the next reconcile scan. Generic: X-ArchTwin-Signature = sha256=HMAC(secret, "{ts}.{body}"),
        X-ArchTwin-Timestamp within 300 s, X-ArchTwin-Delivery. Deliveries are de-duplicated; a commit is extracted once.
        Every rejection returns the same opaque problem (AT-WEBHOOK-001) and stores nothing. Requires flag connectors.webhooks.
      operationId: receiveWebhook
      security: []
      parameters:
        - {in: path, name: orgId, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/ProjectId'}
        - {in: path, name: connectorId, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
      responses:
        '200':
          description: Accepted (or acknowledged duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate: {type: boolean}
                  outcome: {type: string, enum: [scan_queued, duplicate_commit, work_item_updated, ignored_untracked_ref, ignored_branch_deleted, ignored_unknown_repo,
                                          ignored_unknown_project, ignored_delete_until_reconcile, ignored_event, pong]}
        '401': {description: Signature or timestamp invalid (opaque)}
        '404': {description: Unknown connector, webhooks not configured or flag off (opaque)}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.example.invalid/realms/archtwin/.well-known/openid-configuration
  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: {type: string}
  responses:
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Authorization denied (does not reveal protected details)
  schemas:
    CreateProject:
      type: object
      required: [slug, title, purpose]
      properties:
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        title: {type: string, minLength: 3, maxLength: 200}
        purpose: {type: string, maxLength: 5000}
        scope: {type: object, additionalProperties: true}
    Project:
      allOf:
        - {$ref: '#/components/schemas/CreateProject'}
        - type: object
          required: [id, organization_id]
          properties:
            id: {type: string, format: uuid}
            organization_id: {type: string, format: uuid}
