      <title id="ai-design-sequence-title">Grounded cross-platform design</title>
      <desc id="ai-design-sequence-desc">Sequence: the architect UI authorizes projects A and B with Cerbos, a scoped retriever builds an evidence pack and sends it through LiteLLM, which traces to Langfuse and returns options with references that are validated before cited options reach the UI.</desc>
