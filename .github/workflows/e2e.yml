name: e2e (full stack, fake LLM)
on:
  workflow_dispatch:
  schedule: [{cron: "0 3 * * *"}]

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: env (fake LLM, zero tokens)
        run: ./scripts/init-env.sh && mkdir -p ../horizon
      - run: docker compose up -d --build --wait --wait-timeout 900
      - run: cd apps/api && uv sync --frozen && uv run pytest -q -m "integration or e2e" tests/integration tests/e2e
      - run: cd apps/web && npm ci && npx playwright install --with-deps chromium && npx playwright test
      - if: failure()
        run: docker compose logs --tail=300 api worker
