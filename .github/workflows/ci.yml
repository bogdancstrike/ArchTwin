name: ci
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check archtwin tests
      - run: uv run pytest -q
      - run: uv run python ../../scripts/gen-flag-catalog.py --check

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: archtwin, POSTGRES_PASSWORD: ci-owner, POSTGRES_DB: archtwin}
        ports: ["5452:5432"]
        options: --health-cmd "pg_isready -U archtwin" --health-interval 5s --health-retries 20
    env:
      POSTGRES_PASSWORD: ci-owner
      ARCHTWIN_APP_DB_PASSWORD: ci-app
      PGPASSWORD: ci-owner
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: app role (as deploy/postgres/init.sh does)
        run: psql -h localhost -p 5452 -U archtwin -d archtwin -c "CREATE ROLE archtwin_app LOGIN PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS" -c "GRANT USAGE ON SCHEMA public TO archtwin_app"
      - name: migrations up / down / up
        env: {ARCHTWIN_DATABASE_URL: "postgresql+asyncpg://archtwin:ci-owner@localhost:5452/archtwin"}
        run: uv run alembic upgrade head && uv run alembic downgrade base && uv run alembic upgrade head
      - run: uv run pytest -q -m integration tests/integration

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/deploy/cerbos/policies":/policies ghcr.io/cerbos/cerbos:0.39.0 compile /policies

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npx -y @fission-ai/openspec@latest validate --all --strict

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
