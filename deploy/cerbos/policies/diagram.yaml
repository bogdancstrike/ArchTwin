apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: diagram
  importDerivedRoles:
  - project_roles
  rules:
  - actions:
    - view
    - export
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_viewer
  - actions:
    - edit
    - reset_layout
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_editor
