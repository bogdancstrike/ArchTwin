apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: flag
  importDerivedRoles:
  - project_roles
  rules:
  - actions:
    - view
    effect: EFFECT_ALLOW
    derivedRoles:
    - org_member
  - actions:
    - edit
    effect: EFFECT_ALLOW
    derivedRoles:
    - org_administrator
