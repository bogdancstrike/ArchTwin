apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: audit
  importDerivedRoles:
  - project_roles
  rules:
  - actions:
    - view
    - export
    effect: EFFECT_ALLOW
    derivedRoles:
    - org_administrator
  - actions:
    - view
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_manager
    condition:
      match:
        expr: has(request.resource.attr.project_id) && request.resource.attr.project_id
          != ''
