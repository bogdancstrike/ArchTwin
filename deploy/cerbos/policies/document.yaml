apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: document
  importDerivedRoles:
  - project_roles
  rules:
  - actions:
    - view
    - export
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_viewer
  - actions:
    - upload
    - generate
    - edit
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_editor
