apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: connector
  importDerivedRoles:
  - project_roles
  rules:
  - actions:
    - view
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_viewer
  - actions:
    - scan
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_editor
  - actions:
    - create
    - edit
    - delete
    - test
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_manager
  - actions:
    - write_external
    effect: EFFECT_ALLOW
    derivedRoles:
    - project_manager
    condition:
      match:
        expr: request.resource.attr.writeback_enabled == true
